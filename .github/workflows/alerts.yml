name: market-alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      - name: Run market bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_NEWS }}
          POLL_SECONDS: "60"
          RUN_ONCE: "1"
          CALENDAR_MINUTES: "180"
          MIN_IMPACT: "medium"
        run: |
          python bot.py

      - name: Save state
        run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"

          git add -A

          git diff --cached --quiet || (
            git commit -m "update market bot state"
            git push
          )
